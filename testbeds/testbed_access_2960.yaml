---
# ==========================================================
# File: testbed_access_2960.yaml
# Version: 2.1.1
#
# FIX IN THIS VERSION:
# -------------------
# ✔ Added explicit Unicon legacy handling:
#     - connection_timeout
#     - init_exec_commands
#     - init_config_commands
#
# WHY THIS FIX IS REQUIRED:
# ------------------------
# Older Catalyst 2960 (IOS 15.2) may fail during Unicon
# state transitions even when SSH legacy algorithms exist.
# These settings force a clean "any" state bring-up.
# ==========================================================

testbed:
  name: Techit-Sweden
  alias: Techit-Sweden

  credentials:
    default:
      username: admin
      password: cisco   # TODO: replace with Jenkins credentials

  custom:
    owner: Abdulilah Baltah
    contacts: Abdulilah,baltah@vattenfall.com

# ==========================================================
# Devices
# ==========================================================
devices:

  # ----------------------------------------------------------
  # Access Switch 01 (OLDEST IOS — REQUIRED EXTRA FIXES)
  # ----------------------------------------------------------
  home-lab-access-sw01:
    alias: home-lab-access-sw01
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.50

        # 🔴 Legacy SSH (already correct)
        ssh_options: >
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o KexAlgorithms=+diffie-hellman-group1-sha1
          -o KexAlgorithms=+diffie-hellman-group14-sha1
          -o KexAlgorithms=+diffie-hellman-group-exchange-sha1
          -o HostKeyAlgorithms=+ssh-rsa
          -o PubkeyAcceptedAlgorithms=+ssh-rsa

        # ✅ NEW: Force Unicon to tolerate slow / old devices
        connection_timeout: 60

        # ✅ NEW: Prevent Unicon from failing during initial state
        arguments:
          learn_hostname: true
          init_exec_commands:
            - term length 0
            - term width 0
          init_config_commands: []

    custom:
      site: Home_Lab
      role: access-switch
      netmiko_driver: cisco_ios


  # ----------------------------------------------------------
  # Access Switch 02
  # ----------------------------------------------------------
  home-lab-access-sw02:
    alias: home-lab-access-sw02
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.130
        ssh_options: >
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o KexAlgorithms=+diffie-hellman-group1-sha1
          -o KexAlgorithms=+diffie-hellman-group14-sha1
          -o KexAlgorithms=+diffie-hellman-group-exchange-sha1
          -o HostKeyAlgorithms=+ssh-rsa
          -o PubkeyAcceptedAlgorithms=+ssh-rsa
        arguments:
          learn_hostname: true

    custom:
      site: Home_Lab
      role: access-switch
      netmiko_driver: cisco_ios


  # ----------------------------------------------------------
  # Access Switch 03
  # ----------------------------------------------------------
  home-lab-access-sw03:
    alias: home-lab-access-sw03
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.51
        ssh_options: >
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o KexAlgorithms=+diffie-hellman-group1-sha1
          -o KexAlgorithms=+diffie-hellman-group14-sha1
          -o KexAlgorithms=+diffie-hellman-group-exchange-sha1
          -o HostKeyAlgorithms=+ssh-rsa
          -o PubkeyAcceptedAlgorithms=+ssh-rsa
        arguments:
          learn_hostname: true

    custom:
      site: Home_Lab
      role: access-switch
      netmiko_driver: cisco_ios
