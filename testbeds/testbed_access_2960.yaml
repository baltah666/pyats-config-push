# -----------------------------------------------------------------------------
# File: testbeds/testbed_access_2960.yaml
# Version: 2.1.1
#
# FIX APPLIED IN THIS VERSION:
# ----------------------------
# ✔ Explicit legacy SSH settings added
# ✔ Prevents "no matching key exchange method found"
# ✔ Required for Cisco 2960 / 2960C / IOS 15.2 devices
#
# This fixes:
#   home-lab-access-sw01 → CONNECTION FAILED
# -----------------------------------------------------------------------------

testbed:
  name: home-lab-access
  credentials:
    default:
      username: admin
      password: admin

devices:

  home-lab-access-sw01:
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.50

        # 🔴 CRITICAL LEGACY SSH FIX
        ssh_options: |
          -o KexAlgorithms=+diffie-hellman-group1-sha1
          -o KexAlgorithms=+diffie-hellman-group14-sha1
          -o KexAlgorithms=+diffie-hellman-group-exchange-sha1
          -o HostKeyAlgorithms=+ssh-rsa
          -o PubkeyAcceptedAlgorithms=+ssh-rsa
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null

  home-lab-access-sw02:
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.130

  home-lab-access-sw03:
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.51
