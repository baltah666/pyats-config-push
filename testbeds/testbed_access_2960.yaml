---
# ==========================================================
# File: testbed_access_2960.yaml
# Version: 2.1.2
#
# FIX IN THIS VERSION:
# -------------------
# ✔ REMOVED diffie-hellman-group1-sha1
# ✔ Force ONLY KEX algorithms actually supported by sw01
#
# ROOT CAUSE:
# -----------
# home-lab-access-sw01 (IOS 15.2) rejects group1 and fails
# SSH negotiation BEFORE Unicon state handling.
# ==========================================================

testbed:
  name: Techit-Sweden
  alias: Techit-Sweden

  credentials:
    default:
      username: admin
      password: cisco

  custom:
    owner: Abdulilah Baltah
    contacts: Abdulilah,baltah@vattenfall.com

devices:

  # ----------------------------------------------------------
  # Access Switch 01 (STRICT SSH – requires clean KEX list)
  # ----------------------------------------------------------
  home-lab-access-sw01:
    alias: home-lab-access-sw01
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.50

        # ✅ FIXED: Only algorithms offered by the device
        ssh_options: >
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
          -o HostKeyAlgorithms=ssh-rsa
          -o PubkeyAcceptedAlgorithms=ssh-rsa

        connection_timeout: 60

        arguments:
          learn_hostname: true
          init_exec_commands:
            - term length 0
            - term width 0
          init_config_commands: []

    custom:
      site: Home_Lab
      role: access-switch
      netmiko_driver: cisco_ios


  # ----------------------------------------------------------
  # Access Switch 02
  # ----------------------------------------------------------
  home-lab-access-sw02:
    alias: home-lab-access-sw02
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.130
        ssh_options: >
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
          -o HostKeyAlgorithms=ssh-rsa
          -o PubkeyAcceptedAlgorithms=ssh-rsa
        arguments:
          learn_hostname: true

    custom:
      site: Home_Lab
      role: access-switch
      netmiko_driver: cisco_ios


  # ----------------------------------------------------------
  # Access Switch 03
  # ----------------------------------------------------------
  home-lab-access-sw03:
    alias: home-lab-access-sw03
    os: ios
    platform: c2960
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.51
        ssh_options: >
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
          -o HostKeyAlgorithms=ssh-rsa
          -o PubkeyAcceptedAlgorithms=ssh-rsa
        arguments:
          learn_hostname: true

    custom:
      site: Home_Lab
      role: access-switch
      netmiko_driver: cisco_ios
