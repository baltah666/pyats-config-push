---
# ==========================================================
# File: testbed_access_9200.yaml
# Version: 2.2.0
#
# PURPOSE:
#   pyATS testbed for Cisco Catalyst 9200 (IOS-XE)
#
# FIX IN THIS VERSION:
#   - REMOVED legacy SSH KEX algorithms (SHA1)
#   - Allows modern SSH negotiation (curve25519 / sha256)
#   - Fixes: "no matching key exchange method found"
#
# IMPORTANT:
#   - Do NOT copy legacy 2960 SSH options into this file
#   - IOS-XE handles secure crypto correctly by default
# ==========================================================

testbed:
  name: Techit-Sweden
  alias: Techit-Sweden

  credentials:
    default:
      username: admin
      password: cisco   # TODO: move to Jenkins credentials

  custom:
    owner: Abdulilah Baltah
    contacts: Abdulilah,baltah@vattenfall.com

devices:

  # ----------------------------------------------------------
  # Catalyst 9200 – Core / Access Switch
  # ----------------------------------------------------------
  home-lab-core-sw01:
    alias: home-lab-core-sw01
    os: iosxe
    platform: c9200
    type: switch

    connections:
      cli:
        protocol: ssh
        ip: 192.168.1.52

        # IMPORTANT:
        # - No forced KexAlgorithms
        # - Let SSH auto-negotiate secure methods
        ssh_options: >
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null

        arguments:
          learn_hostname: true

    custom:
      site: Home_Lab
      role: access-switch
      netmiko_driver: cisco_ios
